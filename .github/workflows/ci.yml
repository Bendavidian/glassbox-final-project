name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # The project is developed on Windows; CI runs the same OS so that path handling,
    # line endings and file locking behave identically here and on the dev machine.
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned to the lowest version we support, so CI fails on anything that
          # silently requires 3.12. Attribution's kw_only=True already needs 3.10+.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and dev tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # reference/ is excluded from both tools in pyproject.toml. It is read-only
      # material and is never part of the build.
      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m black --check .

      - name: Tests
        run: python -m pytest
