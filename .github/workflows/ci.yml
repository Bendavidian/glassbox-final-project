name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # The project is developed on Windows; CI runs the same OS so that path handling,
    # line endings and file locking behave identically here and on the dev machine.
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the interpreter requirements.lock was frozen on, so CI and a
          # developer machine install an identical set. Attribution's kw_only=True
          # needs 3.10+; numpy and scipy in the lockfile need 3.12+.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      # Install the locked set, then the package itself without re-resolving its
      # dependencies. This is the same install GB-59 audits from a clean clone, so
      # every push exercises it rather than leaving it to be discovered in October.
      - name: Install project and dev tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      # reference/ is excluded from both tools in pyproject.toml. It is read-only
      # material and is never part of the build.
      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m black --check .

      - name: Tests
        run: python -m pytest
