meta:
  version: 3
  seed: 1337

universe: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, TSLA, LLY, JPM, JNJ, V, XOM, UNH, MA, MRK, PG, HD, COST, WMT, ABBV]

data:
  start: "2016-01-01"
  cache_dir: "data_cache"
  calendar: "NYSE"

window:
  input_len: 120        # L — bars the model sees (FITS prefers long look-backs)
  horizon: 4            # H — days forecast ahead

wavelet:
  family: db4
  levels: 3
  rolling_window: 64    # trailing bars per causal decomposition
  mode: symmetric

fits:
  cutoff_period_days: 5 # keep frequencies with period >= this; the ONE hyperparam
  supervision: "B+F"    # "F" = forecast only, "B+F" = backcast + forecast
  individual_weights: false   # false = one shared model across the universe

wits:
  # GB-66. The wavelet core, in the position FITS gives the rFFT.
  family: db4           # 4 vanishing moments: details annihilate the window mean
  levels: 3             # J. Retained bands are L/2**J coefficients long
  retained_bands: 2     # cA3 + cD3; the fast bands are discarded as the LPF discards bins
  boundary: symmetric   # symmetric | zero | periodic -- an AXIS, measured, not a default
  shift_invariant: false  # true selects SWT: shift-invariant, redundant, 29,760 reals
  supervision: "B+F"    # as FITS, so the comparison isolates the transform
  individual_weights: false   # false = one shared model across the universe

channels:
  C0_base:    [close_logret, rsi14, vol_z, mom10, ma_dist20]
  C2_hybrid:  [close_logret, rsi14, vol_z, mom10, ma_dist20, wav_a1, wav_a2, wav_a3]
  active: C0_base       # updated after the study picks a winner

model:
  active: dlinear       # persistence | dlinear | fits | wits
  epochs: 100
  patience: 10
  lr: 0.001
  batch_size: 64        # null would mean one batch of everything; reverted to 64 by
                        # GB-20's re-check on Sharpe and direction — DECISIONS 2026-08-17

signal:
  min_trend: null       # calibrated on validation — never hardcoded
  max_trend: null
  min_up_points: 3
  top_k: 2

risk:
  max_position_pct: 0.10
  max_gross_exposure: 0.50
  stop_loss_pct: 0.03
  take_profit_pct: 0.06

backtest:
  initial_cash: 100000.0  # matches the Alpaca paper account, so the two are comparable
  fee_bps: 1.0
  slippage_bps: 2.0
  # GB-49 axis. false = the classical backtest: the target rests at the broker and fills
  # intraday at the target price. true = the system that can be built: the loop evaluates
  # the target on COMPLETED DAILY BARS and exits at the next open. Alpaca refuses every
  # multi-leg class on a fractional quantity (code 42210000), so `true` is the live path.
  target_in_loop: true

walkforward:
  train_months: 24
  val_months: 3
  test_months: 3
  step_months: 3
  max_folds: 16         # capped for the 8-week budget

live:
  poll_seconds: 60
  mode: co_pilot        # auto | co_pilot
  market_open_il: "16:30"
  market_close_il: "23:00"
  # GB-39. Attempts include the first, and the backoff doubles: 3 and 1.0 waits 1s then
  # 2s and gives up 3s in, which has to stay well inside one poll_seconds or a retrying
  # cycle would still be retrying when the next one is due.
  retry_attempts: 3
  retry_backoff_seconds: 1.0
  # A multi-day run idles for ~17 hours between sessions and, without this, produces the
  # same output while alive as it does after dying: nothing. One line every 15 minutes is
  # ~68 a day, which is a log a person can read and a silence that means something.
  heartbeat_seconds: 900
