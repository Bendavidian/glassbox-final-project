[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glassbox-trader"
version = "0.1.0"
description = "An autonomous equities trading system that explains every decision with exact attribution"
# 3.12, not 3.11: numpy 2.5.2 and scipy 1.18.0 both declare requires_python >= 3.12,
# so the pinned dependency set below has never been installable on 3.11.
# See DECISIONS.md, 2026-08-14.
requires-python = ">=3.12"
readme = "README.md"

# Lower bounds are the versions this project was developed and tested against.
# A clean clone that must reproduce reported results installs requirements.lock
# instead; see DECISIONS.md 2026-08-14 and GB-59.
dependencies = [
    "pandas>=3.0.5",
    "numpy>=2.5.2",
    "pyyaml>=6.0.3",
    "torch>=2.13.0",
    "yfinance>=1.6.0",
    "alpaca-py>=0.44.0",
    "PyWavelets>=1.9.0",
    "scipy>=1.18.0",
    "streamlit>=1.61.1",
    "pandas-market-calendars>=5.4.0",
    "python-dotenv>=1.2.2",
    "pyarrow>=24.0.0",
    # GB-46: the frequency-response figure. See DECISIONS.md, 20 Aug 2026.
    "matplotlib>=3.11.1",
]

[project.optional-dependencies]
# One command sets up a working local environment: pip install -e ".[dev]"
dev = [
    "pytest>=9.1.1",
    "hypothesis>=6.165.5",
    "import-linter>=2.13",
    "ruff>=0.16.3",
    "black>=26.5.1",
    # scripts/capture_screenshots.py drives the console headless. Pinned exactly, because
    # each release expects one browser build. See DECISIONS.md, 28 Sep 2026.
    "playwright==1.61.0",
]

[tool.setuptools.packages.find]
# reference/ is read-only material brought in for study. It is never part of the build,
# is never imported from glassbox/, and is excluded from linting and test collection below.
include = ["glassbox*"]
exclude = ["reference*", "tests*", "docs*", "prompts*"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["reference"]

[tool.black]
target-version = ["py312"]
extend-exclude = '''
/(
    reference
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["reference", "data_cache", "checkpoints", ".git"]
# tests/causality.py is shared test infrastructure (GB-10), imported by GB-48 and GB-25.
# It lives in tests/ rather than the package so the live path cannot import it.
#
# `.` is the rootdir, and it is here because bare `pytest` does not put it on `sys.path`
# the way `python -m pytest` does - CLAUDE.md's "a subset is never the suite" rule names
# bare `pytest`, with no path and no `-k`, as the only invocation that licenses the word
# "green", so bare `pytest` has to be the one that works.
pythonpath = [".", "tests"]

# Rooted at the glassbox package, so reference/ is outside the contract by construction.
[tool.importlinter]
root_package = "glassbox"

# Spec 3.1: data flows strictly upward; no layer imports from a layer above it.
# Listed highest first, which is import-linter's ordering.
#
# backtest and experiments sit above the whole live path, not inside it. Spec 3.1 calls
# them a cross-cutting harness rather than a layer, and the constraint that matters is
# that the harness is never imported by the live path. Placing them on top makes that
# structural: nothing below can reach up to them, while they remain free to drive
# models, features and data, which a walk-forward run must do.
[[tool.importlinter.contracts]]
name = "Layers: data flows strictly upward"
type = "layers"
layers = [
    "glassbox.experiments",
    "glassbox.backtest",
    "glassbox.dashboard",
    "glassbox.explain",
    "glassbox.engine",
    "glassbox.model",
    "glassbox.features",
    "glassbox.data",
    "glassbox.contracts",
    "glassbox.config",
]

# live_loop.py and replay.py are top-level modules, so the layers contract above does
# not constrain them. This states the harness rule for them directly. smoke_offline.py
# is deliberately absent: it is the harness's own entry point and must import backtest.
[[tool.importlinter.contracts]]
name = "The live path never imports the validation harness"
type = "forbidden"
source_modules = [
    "glassbox.live_loop",
    "glassbox.replay",
    # GB-29. `records.py` holds the live trade log, so it is exactly the module that would
    # be tempted to import `backtest.engine.Trade` - which is why that type moved to
    # `contracts/schemas.py` and why this contract now names it.
    "glassbox.records",
]
forbidden_modules = [
    "glassbox.backtest",
    "glassbox.experiments",
]
