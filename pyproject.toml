[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glassbox-trader"
version = "0.1.0"
description = "An autonomous equities trading system that explains every decision with exact attribution"
requires-python = ">=3.11"
# readme = "README.md" is added in GB-12, when the file exists.

# Lower bounds are the versions this project was developed and tested against.
# A clean clone that must reproduce reported results installs requirements.lock
# instead; see DECISIONS.md 2026-08-14 and GB-59.
dependencies = [
    "pandas>=3.0.5",
    "numpy>=2.5.2",
    "pyyaml>=6.0.3",
    "torch>=2.13.0",
    "yfinance>=1.6.0",
    "alpaca-py>=0.44.0",
    "PyWavelets>=1.9.0",
    "scipy>=1.18.0",
    "streamlit>=1.61.1",
    "pandas-market-calendars>=5.4.0",
    "python-dotenv>=1.2.2",
    "pyarrow>=24.0.0",
]

[project.optional-dependencies]
# One command sets up a working local environment: pip install -e ".[dev]"
dev = [
    "pytest>=9.1.1",
    "hypothesis>=6.165.5",
    "import-linter>=2.13",
    "ruff>=0.16.3",
    "black>=26.5.1",
]

[tool.setuptools.packages.find]
# reference/ is read-only material brought in for study. It is never part of the build,
# is never imported from glassbox/, and is excluded from linting and test collection below.
include = ["glassbox*"]
exclude = ["reference*", "tests*", "docs*", "prompts*"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["reference"]

[tool.black]
target-version = ["py311"]
extend-exclude = '''
/(
    reference
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["reference", "data_cache", "checkpoints", ".git"]

# GB-3 adds the import-linter layer contracts here, rooted at the glassbox package only,
# so that reference/ is outside the contract by construction.
